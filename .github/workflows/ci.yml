name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Fetch assets and build the model
        run: |
          homehand fetch-assets
          homehand build-model
      - name: Tests (rendering tests skip without an OpenGL context)
        run: pytest -q
      - name: Web UI type-check and build
        if: matrix.os == 'ubuntu-latest'
        working-directory: web
        run: |
          npm ci || npm install
          npm run build
